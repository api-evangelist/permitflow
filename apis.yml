aid: permitflow
name: PermitFlow
description: 'PermitFlow is an AI-powered construction permitting platform that simplifies
  permit preparation, submission, and tracking nationwide for contractors, home builders,
  commercial contractors, architects, developers, and home-services businesses. The
  product handles permitting paperwork across municipalities with AI agents for intake,
  research, submission, coordination, and issuance, and covers permit management, inspections
  and closeouts, and license and registration management. Backed by Accel, Felicis,
  and Initialized Capital, PermitFlow operates an internal product API (api.permitflow.com)
  and web application (app.permitflow.com) but does not currently publish a public
  developer API, OpenAPI, or developer portal.'
